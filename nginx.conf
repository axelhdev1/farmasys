server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aplicación de una sola página: cualquier ruta que no sea un archivo real
    # cae en index.html y Angular se encarga de enrutar. Sin esto, recargar en
    # /pos o /finanzas daría un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache larga para los archivos con hash en el nombre (no cambian).
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ico)$ {
        expires 7d;
        access_log off;
    }
}
